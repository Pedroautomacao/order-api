# Produção. O PostgreSQL NÃO faz parte deste compose: na VPS ele já existe como
# container `postgres-central` na rede proxy_net, e é por esse hostname que o
# DATABASE_URL do .env aponta.
services:
  api:
    build: .
    container_name: order_api
    restart: always
    env_file:
      - .env
    # `expose` em vez de `ports`: a 8000 fica visível apenas dentro da
    # proxy_net, para o Nginx Proxy Manager. Nada é publicado no host.
    expose:
      - "8000"
    networks:
      - proxy_net

# Rede criada fora deste projeto (junto do Nginx Proxy Manager e do
# postgres-central). Precisa existir antes do `up`.
networks:
  proxy_net:
    external: true
